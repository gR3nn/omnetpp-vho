[General]
network = VerticalHandover
sim-time-limit = 125s
num-rngs = 2
cmdenv-express-mode = true

[Config Legacy]
*.cellular.rng-0 = 0
*.wifi.rng-0 = 1

[Config Demo]
extends = Legacy
description = "Mobile terminal traversing overlapping Wi-Fi and cellular access"

[Config AccountingCheck]
extends = Legacy
description = "One in-coverage completion and one impossible deadline"
sim-time-limit = 8s
*.terminal.speed = 0mps
*.cellular.variation = 0
*.wifi.variation = 0
*.traffic.files = 1
*.traffic.fileSize = 0.12MB
*.traffic.deadline = ${limit=0.5s,2s}

[Config HandoverCheck]
extends = Legacy
description = "Known cellular-to-Wi-Fi switch with fractional-tick interruption"
sim-time-limit = 9s
*.terminal.initialPosition = 143m
*.terminal.handoverDelay = ${setup=0s,0.35s}
*.cellular.variation = 0
*.wifi.variation = 0
*.traffic.files = 1
*.traffic.fileSize = 1MB
*.traffic.deadline = 8s

[Config PolicyCheck]
extends = Legacy
description = "Trade off cheaper cellular against faster Wi-Fi in full overlap"
sim-time-limit = 31s
*.terminal.initialPosition = 300m
*.terminal.speed = 0mps
*.terminal.policy = "${policy=fastest,cheapest,surplus}"
*.wifi.price = 0.26
*.cellular.variation = 0
*.wifi.variation = 0
*.traffic.files = 1
*.traffic.fileSize = 1MB
*.traffic.deadline = ${deadline=1s,30s}

[Config Experiment]
extends = Legacy
description = "Full factorial comparison with common random numbers across policies"
*.terminal.policy = "${policy=fastest,cheapest,surplus}"
*.traffic.deadline = ${deadline=5s,10s,20s}
*.wifi.price = ${price=0.04,0.26}
*.terminal.handoverDelay = ${setup=0.1s,0.8s}
repeat = 20
seed-set = ${repetition}

[Config ModularDemo]
description = "File queue, policy decision, chunk loop and destination acknowledgments"
network = ModularVerticalHandover
*.network1.genLoadCond.rng-0 = 0
*.network2.genLoadCond.rng-0 = 1
*.gen.files = 6
*.gen.interval = 2s
*.gen.fileSize = 1MB
*.gen.deadline = 20s
*.initialPosition = 140m
*.network*.dly.chunkSize = 25000B
sim-time-limit = 30s

[Config ModularQueueCheck]
extends = ModularDemo
description = "Two queued files, exactly two chunks per file, and a deterministic acknowledgment"
sim-time-limit = 1s
*.speed = 0mps
*.initialPosition = 300m
*.gen.files = 2
*.gen.interval = 1ms
*.gen.fileSize = 0.003MB
*.gen.deadline = 1s
*.network*.genLoadCond.variation = 0
*.network*.dly.chunkSize = 1500B

[Config ModularOutageCheck]
extends = ModularQueueCheck
description = "Two deadlines expire when neither network has coverage"
*.routeLength = 800m
*.initialPosition = 800m
*.gen.deadline = 5ms

[Config ModularSwitchCheck]
extends = ModularQueueCheck
description = "Cellular then Wi-Fi, measuring the handover from the destination"
sim-time-limit = 5s
*.speed = 12mps
*.initialPosition = 143m
*.gen.interval = 1.2s
*.svr.handoverDelay = ${setup=0s,0.35s}

[Config ModularPolicyCheck]
extends = ModularQueueCheck
description = "Bootstrap prediction selects cheap cellular while fastest selects Wi-Fi"
*.alg.policy = "${policy=fastest,ormond}"
*.network2.price = 0.26
*.gen.interval = 0.5s
*.gen.fileSize = 0.12MB

[Config ModularDeclineCheck]
extends = ModularOutageCheck
description = "The literature policy permits selecting neither network"
*.alg.policy = "ormond"
